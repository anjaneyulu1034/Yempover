name: Yempover_app
description: "Yempover Battery System Application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^19.5.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  intl: ^0.20.2
  http: ^1.6.0
  shared_preferences: ^2.5.4
  provider: ^6.1.5+1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_places_flutter: ^2.1.1
  firebase_messaging: ^16.1.1
  firebase_core: ^4.4.0
 

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21

  # Android 12+ adaptive icon fix (prevents small icon issue)
  adaptive_icon_background: "#2F55D4"
  adaptive_icon_foreground: "assets/app_logo.png"

  # iOS icon fix
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png
