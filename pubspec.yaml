name: yempover_app
description: "BarterX mobile application."
publish_to: "none"

version: 1.0.2+3

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^19.5.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  intl: ^0.20.2
  http: ^1.6.0
  shared_preferences: ^2.5.4
  provider: ^6.1.5+1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_places_flutter: ^2.1.1
  firebase_messaging: ^16.1.1
  firebase_core: ^4.4.0
  socket_io_client: ^3.1.4
  url_launcher: ^6.3.1
  flutter_widget_from_html_core: ^0.15.0
  country_code_picker: ^3.4.1
 

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Yempover_Org-logo.png"
  min_sdk_android: 21

  # Android 12+ adaptive icon fix (prevents small icon issue)
  adaptive_icon_background: "#2F55D4"
  adaptive_icon_foreground: "assets/Yempover_Org-logo.png"

  # iOS icon fix
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/Yempover_Org-logo.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/Yempover_Org-logo.png
    - assets/Yempover_logo.png
    - assets/icons_logo.png
    - assets/chat-message-icon.jpg
    - assets/chat_icons.png
    - assets/image.png
